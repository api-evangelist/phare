  description: Triggered when a monitor's certificate is nearing expiration.
- event: Incident Created
  description: Triggered when a new incident is created.
- event: Incident Recovered
  description: Triggered when an incident is recovered.
- event: Incident Propagated
  description: Triggered when an incident propagates to a new monitor.
- event: Incident Partially Recovered
  description: Triggered when an incident is partially recovered.
- event: Incident Comment Created
  description: Triggered when a comment is added to an incident.
- event: Incident Update Published
  description: Triggered when an update is published for an incident.
