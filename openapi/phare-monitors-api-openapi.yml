          example: https://api.phare.io/{resource}?page=1
      type: object
    Uptime.Monitor.ProtocolEnum:
      type: string
      enum:
      - http
      - tcp
    Uptime.Monitor.StatusEnum:
      type: string
      enum:
      - fetching
      - online
      - offline
      - partial
      - paused
    Uptime.Monitor.RegionEnum:
