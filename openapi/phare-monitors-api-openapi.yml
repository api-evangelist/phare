  /uptime/monitors/{monitorId}/report:
    get:
      tags:
      - Monitors
      summary: Get a monitor report
      description: Get uptime statistics for a single monitor by ID in the selected time window
      operationId: getUptimeMonitorReport
      parameters:
      - name: monitorId
        in: path
        description: ID of the monitor to report on
        required: true
        schema:
          type: integer
      - name: from
        in: query
        description: Start of the reporting window
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-04-01T00:00:00Z'
      - name: to
        in: query
        description: End of the reporting window
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-04-30T23:59:59Z'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/header_project_id'
      - $ref: '#/components/parameters/header_project_slug'
      responses:
        '200':
          description: Success, monitor report retrieved
          content:
            application/json:
              schema:
                properties:
                  id:
                    description: Monitor ID
                    type: integer
                    example: 12
                  name:
                    description: Monitor name
                    type: string
                    example: Website
                  incident_count:
                    description: Number of incidents affecting this monitor in the selected range
                    type: integer
                    example: 2
                  downtime:
                    description: Total downtime for this monitor in seconds
                    type: integer
                    example: 1500
                  availability:
                    description: Availability for this monitor in the selected range, as a percentage
                    type: number
                    format: float
                    example: 99.944
                  mttr:
                    description: Mean time to recovery (MTTR) for this monitor, in seconds
                    type:
                    - integer
                    - 'null'
                    example: 750
                  mtbf:
                    description: Mean time between failures (MTBF) for this monitor, in seconds
                    type:
                    - integer
                    - 'null'
                    example: 43200
                  highest_incident_impact:
                    $ref: '#/components/schemas/Uptime.Incident.ImpactEnum'
                  incidents:
                    description: Incidents that affected this monitor in the selected range
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        project_id:
                          description: Parent project ID
                          type: integer
                          example: 1
                        type:
                          $ref: '#/components/schemas/Uptime.Incident.TypeEnum'
                        slug:
                          description: Incident unique slug name
                          type: string
                          example: APP-123
                        impact:
                          $ref: '#/components/schemas/Uptime.Incident.ImpactEnum'
                        state:
                          $ref: '#/components/schemas/Uptime.Incident.StateEnum'
                        status:
                          $ref: '#/components/schemas/Uptime.Incident.StatusEnum'
                        title:
                          description: Incident title
                          type: string
                          example: Service is not working as expected
                          maximum: 250
                          minimum: 1
                        description:
                          description: Description of the error that caused the incident
                          type: string
                          example: 'The server answered with an unexpected status code: 503.'
                          maximum: 2000
                          minimum: 1
                        exclude_from_downtime:
                          description: Flag to exclude the incident from downtime calculations
                          type: boolean
                          example: false
                        incident_at:
                          description: Date of incident confirmation
                          type:
                          - string
                          - 'null'
                          format: date-time
                        recovery_at:
                          description: Date of incident recovery
                          type:
                          - string
                          - 'null'
                          format: date-time
                        monitors:
                          description: List of monitors linked to the incident
                          type: array
                          items:
                            type: integer
                          example:
                          - 1
                          - 2
                          - 3
                          maxItems: 100
                          minItems: 1
                        created_at:
                          description: Date of creation for the entity
                          type: string
                          format: date-time
                        updated_at:
                          description: Date of last update for the entity
                          type: string
                          format: date-time
                      required:
                      - impact
                      - title
                      - exclude_from_downtime
                type: object
        '422':
          $ref: '#/components/responses/422'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
