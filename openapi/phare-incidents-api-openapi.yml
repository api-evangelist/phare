openapi: 3.2.0
info:
  title: Phare Incidents API
  description: Learn how to use the phare.io API. Most of the things that can be done on the web platform can also be achieved with the API documented on this page.
  termsOfService: https://phare.io/legal/terms-of-service
  contact:
    name: Phare
    email: support@phare.io
  version: '1.0'
servers:
- url: https://api.phare.io
security:
- BearerAuth: []
tags:
- name: Incidents
  description: Incidents
paths:
  /uptime/incidents:
    get:
      tags:
      - Incidents
      summary: List incidents
      description: Get a paginated list of incidents
      operationId: getUptimeIncidents
      parameters:
      - name: monitor_id
        in: query
        description: Filter incidents by monitor ID. Can be specified multiple times to filter by multiple monitor IDs.
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/header_project_id'
      - $ref: '#/components/parameters/header_project_slug'
      responses:
        '200':
          description: Success, incidents retrieved
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        project_id:
                          description: Parent project ID
                          type: integer
                          example: 1
                        type:
                          $ref: '#/components/schemas/Uptime.Incident.TypeEnum'
                        slug:
                          description: Incident unique slug name
                          type: string
                          example: APP-123
                        impact:
                          $ref: '#/components/schemas/Uptime.Incident.ImpactEnum'
                        state:
                          $ref: '#/components/schemas/Uptime.Incident.StateEnum'
                        status:
                          $ref: '#/components/schemas/Uptime.Incident.StatusEnum'
                        title:
                          description: Incident title
                          type: string
                          example: Service is not working as expected
                          maximum: 250
                          minimum: 1
                        description:
                          description: Description of the error that caused the incident
                          type: string
                          example: 'The server answered with an unexpected status code: 503.'
                          maximum: 2000
                          minimum: 1
                        exclude_from_downtime:
                          description: Flag to exclude the incident from downtime calculations
                          type: boolean
                          example: false
                        incident_at:
                          description: Date of incident confirmation
                          type:
                          - string
                          - 'null'
                          format: date-time
                        recovery_at:
                          description: Date of incident recovery
                          type:
                          - string
                          - 'null'
                          format: date-time
                        monitors:
                          description: List of monitors linked to the incident
                          type: array
                          items:
                            type: integer
                          example:
                          - 1
                          - 2
                          - 3
                          maxItems: 100
                          minItems: 1
                        created_at:
                          description: Date of creation for the entity
                          type: string
                          format: date-time
                        updated_at:
                          description: Date of last update for the entity
                          type: string
                          format: date-time
                      required:
                      - impact
                      - title
                      - exclude_from_downtime
                  meta:
                    $ref: '#/components/schemas/meta'
                  links:
                    $ref: '#/components/schemas/links'
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      tags:
      - Incidents
      summary: Create an incident
      operationId: createUptimeIncident
      requestBody:
        description: Incident request
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  description: Incident title
                  type: string
                  example: Service is not working as expected
                  maximum: 250
                  minimum: 1
                description:
                  description: Description of the error that caused the incident
                  type: string
                  example: 'The server answered with an unexpected status code: 503.'
                  maximum: 2000
                  minimum: 1
                exclude_from_downtime:
                  description: Flag to exclude the incident from downtime calculations
                  type: boolean
                  example: false
                incident_at:
                  description: Date of incident confirmation
                  type:
                  - string
                  - 'null'
                  format: date-time
                recovery_at:
                  description: Date of incident recovery
                  type:
                  - string
                  - 'null'
                  format: date-time
                monitors:
                  description: List of monitors linked to the incident
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                  maxItems: 100
                  minItems: 1
                impact:
                  description: Incident impact
                  type: string
                  enum:
                  - unknown
                  - degraded_performance
                  - partial_outage
                  - major_outage
              required:
              - impact
              - title
              - exclude_from_downtime
      responses:
        '201':
          description: Success, incident created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  project_id:
                    description: Parent project ID
                    type: integer
                    example: 1
                  type:
                    $ref: '#/components/schemas/Uptime.Incident.TypeEnum'
                  slug:
                    description: Incident unique slug name
                    type: string
                    example: APP-123
                  impact:
                    $ref: '#/components/schemas/Uptime.Incident.ImpactEnum'
                  state:
                    $ref: '#/components/schemas/Uptime.Incident.StateEnum'
                  status:
                    $ref: '#/components/schemas/Uptime.Incident.StatusEnum'
                  title:
                    description: Incident title
                    type: string
                    example: Service is not working as expected
                    maximum: 250
                    minimum: 1
                  description:
                    description: Description of the error that caused the incident
                    type: string
                    example: 'The server answered with an unexpected status code: 503.'
                    maximum: 2000
                    minimum: 1
                  exclude_from_downtime:
                    description: Flag to exclude the incident from downtime calculations
                    type: boolean
                    example: false
                  incident_at:
                    description: Date of incident confirmation
                    type:
                    - string
                    - 'null'
                    format: date-time
                  recovery_at:
                    description: Date of incident recovery
                    type:
                    - string
                    - 'null'
                    format: date-time
                  monitors:
                    description: List of monitors linked to the incident
                    type: array
                    items:
                      type: integer
                    example:
                    - 1
                    - 2
                    - 3
                    maxItems: 100
                    minItems: 1
                  created_at:
                    description: Date of creation for the entity
                    type: string
                    format: date-time
                  updated_at:
                    description: Date of last update for the entity
                    type: string
                    format: date-time
                required:
                - impact
                - title
                - exclude_from_downtime
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
