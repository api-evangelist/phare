                  access_ips:
                    description: List of IP addresses or CIDR ranges allowed to access the status page. Requires an active Scale plan subscription.
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: 45.129.56.0/24
                    maxItems: 50
                    minItems: 1
                  created_at:
