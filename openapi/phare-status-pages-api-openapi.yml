openapi: 3.2.0
info:
  title: Phare Status Pages API
  description: Learn how to use the phare.io API. Most of the things that can be done on the web platform can also be achieved with the API documented on this page.
  termsOfService: https://phare.io/legal/terms-of-service
  contact:
    name: Phare
    email: support@phare.io
  version: '1.0'
servers:
- url: https://api.phare.io
security:
- BearerAuth: []
tags:
- name: Status Pages
  description: Status Pages
paths:
  /uptime/status-pages:
    get:
      tags:
      - Status Pages
      summary: List status pages
      description: Get a paginated list of status pages
      operationId: getUptimeStatusPages
      responses:
        '200':
          description: Success, status pages retrieved
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Status page ID
                          type: integer
                          example: 1
                        project_id:
                          description: Parent project ID
                          type: integer
                          example: 1
                        is_private:
                          description: Whether the status page requires authentication to access
                          type: boolean
                          example: false
                        access_password_enabled:
                          description: Whether the status page is protected by a password. Requires an active Scale plan subscription.
                          type: boolean
                          example: false
                        access_token_enabled:
                          description: Whether the status page is protected by a secret token. Requires an active Scale plan subscription.
                          type: boolean
                          example: false
                        name:
                          description: Status page name
                          type: string
                          example: Phare status
                          maximum: 30
                          minimum: 2
                        subdomain:
                          description: 'Subdomain name for the status page, hosted on a phare.io domain: {subdomain}.status.phare.io'
                          type: string
                          example: example
                          maximum: 30
                          minimum: 2
                        domain:
                          description: Custom domain name for the status page
                          type:
                          - string
                          - 'null'
                          example: status.example.com
                          maximum: 253
                          minimum: 4
                        title:
                          description: Status page HTML title
                          type: string
                          example: Phare status
                          maximum: 250
                          minimum: 2
                        description:
                          description: Status page HTML description
                          type: string
                          example: Status page of phare.io
                          maximum: 250
                          minimum: 2
                        search_engine_indexed:
                          description: Whether search engines are allowed to index the page
                          type: boolean
                          example: true
                        website_url:
                          description: URL to redirect users clicking the status page logo
                          type: string
                          example: https://phare.io
                          maximum: 250
                        color_scheme:
                          description: Choose the available color schemes for the status page
                          type: string
                          example: all
                          enum:
                          - all
                          - dark
                          - light
                        theme:
                          description: Theme settings to customize the status page
                          properties:
                            light:
                              description: Light theme colors
                              properties:
                                operational:
                                  type: string
                                  example: '#16a34a'
                                degraded_performance:
                                  type: string
                                  example: '#fbbf24'
                                partial_outage:
                                  type: string
                                  example: '#f59e0b'
                                major_outage:
                                  type: string
                                  example: '#ef4444'
                                maintenance:
                                  type: string
                                  example: '#6366f1'
                                empty:
                                  type: string
                                  example: '#d3d3d3'
                                background:
                                  type: string
                                  example: '#ffffff'
                                foreground:
                                  type: string
                                  example: '#000000'
                                foreground_muted:
                                  type: string
                                  example: '#737373'
                                background_card:
                                  type: string
                                  example: '#fafafa'
                              type: object
                            dark:
                              description: Dark theme colors
                              properties:
                                operational:
                                  type: string
                                  example: '#16a34a'
                                degraded_performance:
                                  type: string
                                  example: '#fbbf24'
                                partial_outage:
                                  type: string
                                  example: '#f59e0b'
                                major_outage:
                                  type: string
                                  example: '#ef4444'
                                maintenance:
                                  type: string
                                  example: '#6366f1'
                                empty:
                                  type: string
                                  example: '#d3d3d3'
                                background:
                                  type: string
                                  example: '#111111'
                                foreground:
                                  type: string
                                  example: '#ffffff'
                                foreground_muted:
                                  type: string
                                  example: '#959595'
                                background_card:
                                  type: string
                                  example: '#1a1a1a'
                              type: object
                            rounded:
                              type: boolean
                              example: true
                            border_width:
                              type: integer
                              example: 2
                              maximum: 3
                              minimum: 0
                          type: object
                        components:
                          description: List of components to show on the status page
                          type: array
                          items:
                            oneOf:
                            - title: Monitor component
                              required:
                              - componentable_type
                              - componentable_id
                              properties:
                                componentable_type:
                                  type: string
                                  enum:
                                  - uptime/monitor
                                componentable_id:
                                  description: ID of the monitor to show
                                  type: integer
                                display_name:
                                  description: Custom display name of the monitor on the status page
                                  type:
                                  - string
                                  - 'null'
                                  example: Main Website
                                  default: null
                              type: object
                            - title: Group component
                              required:
                              - componentable_type
                              - name
                              - components
                              properties:
                                componentable_type:
                                  type: string
                                  enum:
                                  - uptime/group
                                name:
                                  description: Name of the group shown on the status page
                                  type: string
                                is_expanded:
                                  description: Whether the group components are expanded by default
                                  type: boolean
                                  example: false
                                components:
                                  description: List of monitor components shown inside the group
                                  type: array
                                  items:
                                    required:
                                    - componentable_type
                                    - componentable_id
                                    properties:
                                      componentable_type:
                                        type: string
                                        enum:
                                        - uptime/monitor
                                      componentable_id:
                                        description: ID of the monitor to show
                                        type: integer
                                      display_name:
                                        description: Custom display name of the monitor on the status page
                                        type:
                                        - string
                                        - 'null'
                                        example: Main Website
                                        default: null
                                    type: object
                              type: object
                        timeframe:
                          description: Number of days of status and incident history to display.
                          type: integer
                          example: 90
                          enum:
                          - 30
                          - 60
                          - 90
                        show_response_times:
                          description: Whether to display response times for monitors on the status page
                          type: boolean
                          example: true
                          default: true
                        subscription_channels:
                          description: List of active subscription channels
                          type: array
                          items:
                            $ref: '#/components/schemas/Uptime.StatusPage.SubscriptionChannelEnum'
                          maxItems: 3
                          minItems: 0
                        access_ips:
                          description: List of IP addresses or CIDR ranges allowed to access the status page. Requires an active Scale plan subscription.
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                            example: 45.129.56.0/24
                          maxItems: 50
                          minItems: 1
                        created_at:
                          description: Date of creation for the entity
                          type: string
                          format: date-time
                        updated_at:
                          description: Date of last update for the entity
                          type: string
                          format: date-time
                      required:
                      - name
                      - subdomain
                      - title
                      - description
                      - search_engine_indexed
                      - website_url
                      - components
                  meta:
                    $ref: '#/components/schemas/meta'
                  links:
                    $ref: '#/components/schemas/links'
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/header_project_id'
      - $ref: '#/components/parameters/header_project_slug'
    post:
      tags:
      - Status Pages
      summary: Create a status page
      operationId: createUptimeStatusPage
      requestBody:
        description: Status page request
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Status page name
                  type: string
                  example: Phare status
                  maximum: 30
                  minimum: 2
                subdomain:
                  description: 'Subdomain name for the status page, hosted on a phare.io domain: {subdomain}.status.phare.io'
                  type: string
                  example: example
                  maximum: 30
                  minimum: 2
                domain:
                  description: Custom domain name for the status page
                  type:
                  - string
                  - 'null'
                  example: status.example.com
                  maximum: 253
                  minimum: 4
                title:
                  description: Status page HTML title
                  type: string
                  example: Phare status
                  maximum: 250
                  minimum: 2
                description:
                  description: Status page HTML description
                  type: string
                  example: Status page of phare.io
                  maximum: 250
                  minimum: 2
                search_engine_indexed:
                  description: Whether search engines are allowed to index the page
                  type: boolean
                  example: true
                website_url:
                  description: URL to redirect users clicking the status page logo
                  type: string
                  example: https://phare.io
                  maximum: 250
                color_scheme:
                  description: Choose the available color schemes for the status page
                  type: string
                  example: all
                  enum:
                  - all
                  - dark
                  - light
                theme:
                  description: Theme settings to customize the status page
                  properties:
                    light:
                      description: Light theme colors
                      properties:
                        operational:
                          type: string
                          example: '#16a34a'
                        degraded_performance:
                          type: string
                          example: '#fbbf24'
                        partial_outage:
                          type: string
                          example: '#f59e0b'
                        major_outage:
                          type: string
                          example: '#ef4444'
                        maintenance:
                          type: string
                          example: '#6366f1'
                        empty:
                          type: string
                          example: '#d3d3d3'
                        background:
                          type: string
                          example: '#ffffff'
                        foreground:
                          type: string
                          example: '#000000'
                        foreground_muted:
                          type: string
                          example: '#737373'
                        background_card:
                          type: string
                          example: '#fafafa'
                      type: object
                    dark:
                      description: Dark theme colors
                      properties:
                        operational:
                          type: string
                          example: '#16a34a'
                        degraded_performance:
                          type: string
                          example: '#fbbf24'
                        partial_outage:
                          type: string
                          example: '#f59e0b'
                        major_outage:
                          type: string
                          example: '#ef4444'
                        maintenance:
                          type: string
                          example: '#6366f1'
                        empty:
                          type: string
                          example: '#d3d3d3'
                        background:
                          type: string
                          example: '#111111'
                        foreground:
                          type: string
                          example: '#ffffff'
                        foreground_muted:
                          type: string
                          example: '#959595'
                        background_card:
                          type: string
                          example: '#1a1a1a'
                      type: object
                    rounded:
                      type: boolean
                      example: true
                    border_width:
                      type: integer
                      example: 2
                      maximum: 3
                      minimum: 0
                  type: object
                components:
                  description: List of components to show on the status page
                  type: array
                  items:
                    oneOf:
                    - title: Monitor component
                      required:
                      - componentable_type
                      - componentable_id
                      properties:
                        componentable_type:
                          type: string
                          enum:
                          - uptime/monitor
                        componentable_id:
                          description: ID of the monitor to show
                          type: integer
                        display_name:
                          description: Custom display name of the monitor on the status page
                          type:
                          - string
                          - 'null'
                          example: Main Website
                          default: null
                      type: object
                    - title: Group component
                      required:
                      - componentable_type
                      - name
                      - components
                      properties:
                        componentable_type:
                          type: string
                          enum:
                          - uptime/group
                        name:
                          description: Name of the group shown on the status page
                          type: string
                        is_expanded:
                          description: Whether the group components are expanded by default
                          type: boolean
                          example: false
                        components:
                          description: List of monitor components shown inside the group
                          type: array
                          items:
                            required:
                            - componentable_type
                            - componentable_id
                            properties:
                              componentable_type:
                                type: string
                                enum:
                                - uptime/monitor
                              componentable_id:
                                description: ID of the monitor to show
                                type: integer
                              display_name:
                                description: Custom display name of the monitor on the status page
                                type:
                                - string
                                - 'null'
                                example: Main Website
                                default: null
                            type: object
                      type: object
                timeframe:
                  description: Number of days of status and incident history to display.
                  type: integer
                  example: 90
                  enum:
                  - 30
                  - 60
                  - 90
                show_response_times:
                  description: Whether to display response times for monitors on the status page
                  type: boolean
                  example: true
                  default: true
                subscription_channels:
                  description: List of active subscription channels
                  type: array
                  items:
                    $ref: '#/components/schemas/Uptime.StatusPage.SubscriptionChannelEnum'
                  maxItems: 3
                  minItems: 0
                access_ips:
                  description: List of IP addresses or CIDR ranges allowed to access the status page. Requires an active Scale plan subscription.
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    example: 45.129.56.0/24
                  maxItems: 50
                  minItems: 1
                logo_light:
                  description: 'Manage the light theme logo of the status page (accepted formats: jpeg / png / svg)'
                  oneOf:
                  - description: 'Any image file with the following format: jpeg / png / svg.'
                    type:
                    - string
                    - 'null'
                    format: file
                  - description: If "false" is passed to the request the logo will be removed
                    type:
                    - string
                    - 'null'
                    example: 'false'
                    enum:
                    - 'false'
                logo_dark:
                  description: 'Manage the dark theme logo of the status page (accepted formats: jpeg / png / svg)'
                  oneOf:
                  - description: 'Any image file with the following format: jpeg / png / svg.'
                    type:
                    - string
                    - 'null'
                    format: file
                  - description: If "false" is passed to the request the logo will be removed
                    type:
                    - string
                    - 'null'
                    example: 'false'
                    enum:
                    - 'false'
                favicon_light:
                  description: 'Manage the light theme favicon of the status page (accepted formats: png / svg)'
                  oneOf:
                  - description: 'Any image file with the following format: png / svg.'
                    type:
                    - string
                    - 'null'
                    format: file
                  - description: If "false" is passed to the request the favicon will be removed
                    type:
                    - string
                    - 'null'
                    example: 'false'
                    enum:
                    - 'false'
                favicon_dark:
                  description: 'Manage the dark theme favicon of the status page (accepted formats: png / svg)'
                  oneOf:
                  - description: 'Any image file with the following format: png / svg.'
                    type:
                    - string
                    - 'null'
                    format: file
                  - description: If "false" is passed to the request the favicon will be removed
                    type:
                    - string
                    - 'null'
                    example: 'false'
                    enum:
                    - 'false'
                access_token:
                  description: Token to restrict access to the status page. Requires an active Scale plan subscription.
                  type:
                  - string
                  - 'null'
                  example: secret
                  maxLength: 500
                  minLength: 8
                access_password:
                  description: Password to restrict access to the status page. Requires an active Scale plan subscription.
                  type:
                  - string
                  - 'null'
                  example: secret
                  maxLength: 500
                  minLength: 8
              required:
              - name
              - subdomain
              - title
              - description
              - search_engine_indexed
              - website_url
              - components
      responses:
        '201':
          description: Success, status page created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: Status page ID
                    type: integer
                    example: 1
                  project_id:
                    description: Parent project ID
                    type: integer
                    example: 1
                  is_private:
                    description: Whether the status page requires authentication to access
                    type: boolean
                    example: false
                  access_password_enabled:
                    description: Whether the status page is protected by a password. Requires an active Scale plan subscription.
                    type: boolean
                    example: false
                  access_token_enabled:
                    description: Whether the status page is protected by a secret token. Requires an active Scale plan subscription.
                    type: boolean
                    example: false
                  name:
                    description: Status page name
                    type: string
                    example: Phare status
                    maximum: 30
                    minimum: 2
                  subdomain:
                    description: 'Subdomain name for the status page, hosted on a phare.io domain: {subdomain}.status.phare.io'
                    type: string
                    example: example
                    maximum: 30
                    minimum: 2
                  domain:
                    description: Custom domain name for the status page
                    type:
                    - string
                    - 'null'
                    example: status.example.com
                    maximum: 253
                    minimum: 4
                  title:
                    description: Status page HTML title
                    type: string
                    example: Phare status
                    maximum: 250
                    minimum: 2
                  description:
                    description: Status page HTML description
                    type: string
                    example: Status page of phare.io
                    maximum: 250
                    minimum: 2
                  search_engine_indexed:
                    description: Whether search engines are allowed to index the page
                    type: boolean
                    example: true
                  website_url:
                    description: URL to redirect users clicking the status page logo
                    type: string
                    example: https://phare.io
                    maximum: 250
                  color_scheme:
                    description: Choose the available color schemes for the status page
                    type: string
                    example: all
                    enum:
                    - all
                    - dark
                    - light
                  theme:
                    description: Theme settings to customize the status page
                    properties:
                      light:
                        description: Light theme colors
                        properties:
                          operational:
                            type: string
                            example: '#16a34a'
                          degraded_performance:
                            type: string
                            example: '#fbbf24'
                          partial_outage:
                            type: string
                            example: '#f59e0b'
                          major_outage:
                            type: string
                            example: '#ef4444'
                          maintenance:
                            type: string
                            example: '#6366f1'
                          empty:
                            type: string
                            example: '#d3d3d3'
                          background:
                            type: string
                            example: '#ffffff'
                          foreground:
                            type: string
                            example: '#000000'
                          foreground_muted:
                            type: string
                            example: '#737373'
                          background_card:
                            type: string
                            example: '#fafafa'
                        type: object
                      dark:
                        description: Dark theme colors
                        properties:
                          operational:
                            type: string
                            example: '#16a34a'
                          degraded_performance:
                            type: string
                            example: '#fbbf24'
                          partial_outage:
                            type: string
                            example: '#f59e0b'
                          major_outage:
                            type: string
                            example: '#ef4444'
                          maintenance:
                            type: string
                            example: '#6366f1'
                          empty:
                            type: string
                            example: '#d3d3d3'
                          background:
                            type: string
                            example: '#111111'
                          foreground:
                            type: string
                            example: '#ffffff'
                          foreground_muted:
                            type: string
                            example: '#959595'
                          background_card:
                            type: string
                            example: '#1a1a1a'
                        type: object
                      rounded:
                        type: boolean
                        example: true
                      border_width:
                        type: integer
                        example: 2
                        maximum: 3
                        minimum: 0
                    type: object
                  components:
                    description: List of components to show on the status page
                    type: array
                    items:
                      oneOf:
                      - title: Monitor component
                        required:
                        - componentable_type
                        - componentable_id
                        properties:
                          componentable_type:
                            type: string
                            enum:
                            - uptime/monitor
                          componentable_id:
                            description: ID of the monitor to show
                            type: integer
                          display_name:
                            description: Custom display name of the monitor on the status page
                            type:
                            - string
                            - 'null'
                            example: Main Website
                            default: null
                        type: object
                      - title: Group component
                        required:
                        - componentable_type
                        - name
                        - components
                        properties:
                          componentable_type:
                            type: string
                            enum:
                            - uptime/group
                          name:
                            description: Name of the group shown on the status page
                            type: string
                          is_expanded:
                            description: Whether the group components are expanded by default
                            type: boolean
                            example: false
                          components:
                            description: List of monitor components shown inside the group
                            type: array
                            items:
                              required:
                              - componentable_type
                              - componentable_id
                              properties:
                                componentable_type:
                                  type: string
                                  enum:
                                  - uptime/monitor
                                componentable_id:
                                  description: ID of the monitor to show
                                  type: integer
                                display_name:
                                  description: Custom display name of the monitor on the status page
                                  type:
                                  - string
                                  - 'null'
                                  example: Main Website
                                  default: null
                              type: object
                        type: object
                  timeframe:
                    description: Number of days of status and incident history to display.
                    type: integer
