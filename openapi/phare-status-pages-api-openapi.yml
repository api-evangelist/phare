                    - 30
                    - 60
                    - 90
                  show_response_times:
                    description: Whether to display response times for monitors on the status page
                    type: boolean
                    example: true
                    default: true
                  subscription_channels:
                    description: List of active subscription channels
                    type: array
                    items:
                      $ref: '#/components/schemas/Uptime.StatusPage.SubscriptionChannelEnum'
                    maxItems: 3
